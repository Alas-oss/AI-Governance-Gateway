  allowed_tool_prefixes: []
  restricted_doc_tags:
    - "[INTERNAL-SENIOR-ONLY]"
    - "[INTERNAL-ADMIN-ONLY]"
    - "[FINANCE-RESTRICTED]"
  allow_all_tools: false

department_policies:
